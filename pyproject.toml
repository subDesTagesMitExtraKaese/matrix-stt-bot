[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-stt-bot"
version = "0.1.0"
description = "Matrix bot that transcribes audio and video messages with whisper.cpp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "simplematrixbotlib==2.13.1",
    "aiohttp==3.14.5",
    "matrix-nio[e2e]==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[project.scripts]
matrix-stt-bot = "matrix_stt_bot.app:run"

[tool.setuptools.packages.find]
include = ["matrix_stt_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

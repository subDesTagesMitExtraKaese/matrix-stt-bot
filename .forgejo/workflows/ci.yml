name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run unit tests
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            python:3.13-slim \
            sh -c "pip install --no-cache-dir '.[dev]' && pytest -q -p no:cacheprovider"

  image:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build image
        run: docker build -t matrix-stt-bot:ci .
      - name: Smoke test image
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/whisper.cpp/samples:/samples:ro" \
            matrix-stt-bot:ci python3 /tests/smoke_test.py
